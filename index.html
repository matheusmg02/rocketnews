<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RocketNews</title>
    <link rel="icon" href="assets/icon.png" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="main-container">
      <div class="container-left">
        <img class="img-logo" src="assets/logo.svg" alt="" />
        <section class="info-content">
          <h2>atualize ideias e informações em 5 minutos.</h2>
          <p class="info-subtitle">
            tudo que você precisa saber para começar seu dia bem e informado
          </p>
          <p class="info-description">
            noticias sobre o universo Rocketseat, e tudo o que precisa para
            começar o dia melhor. perfeito para se preparar para codar ☕
          </p>
        </section>

        <form class="form-container">
          <h3>Insira seu e-mail:</h3>
          <div class="input-wrapper">
            <input type="text" placeholder="oi@rocketseat.com"/>
            <button type="submit">
              <img src="assets/send.svg" alt="">
            </button>
          </div>
        </form>
        
        <div class="read-link-container">
          <a class="read-link" href="/">deixe-me ler primeiro</a>
          <img src="assets/arrow-right.svg" alt="">
        </div>
      </div>
      
      <div class="container-right">
        <img src="assets/read_news.jpg" alt="" />
      </div>
    </main>
  </body>
</html>
